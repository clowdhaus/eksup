[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

# Exclude xtask from `cargo release` workspace bumps. xtask is internal build
# infrastructure, not a shipped artifact — its version doesn't track eksup's.
[package.metadata.release]
release = false

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
eksup = { path = "../eksup" }
clap = { version = "4.6", default-features = false, features = ["std", "derive"] }
clap_complete = { version = "4.5", default-features = false }
clap_mangen = { version = "0.2", default-features = false }
